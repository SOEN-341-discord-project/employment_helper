name: Project CI

# Run whenever code is pushed or a pull request is opened/updated.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Exercise the Supabase triggers on a disposable PostgreSQL database for each push and PR.
  deadline-reminders:
    runs-on: ubuntu-latest
    container: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reminder_test
          POSTGRES_PASSWORD: local_test_only
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      # Run the interview lifecycle checks against the same disposable notification schema.
      - name: Test application deadline and interview reminders
        env:
          PGPASSWORD: local_test_only
        run: psql -X -h postgres -U postgres -d reminder_test -v ON_ERROR_STOP=1 -f tests/application-deadline-reminders.sql -f tests/interview-notifications.sql

  check:
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto GitHub's temporary computer.
      - name: Get the code
        uses: actions/checkout@v6

      # Use Node.js to run the checks.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Install the exact dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Check each JavaScript file without starting the server.
      - name: Check JavaScript syntax
        run: find client server -name "*.js" -print0 | xargs -0 -n 1 node --check

          # Run the automated tests.
      - name: Run automated tests
        run: npm test