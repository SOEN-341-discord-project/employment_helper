<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>

    <div class="page">
  <div class="left">
      <section class="register">
        <img class="logo" src="logo.png" alt="CareerConnect logo" />
        <h1>CareerConnect</h1>
        <p class="info">Your job search made simple.</p>

        <form id="registerForm">
          <!-- Radio buttons allow exactly one account type to be selected. -->
          <fieldset class="account-type">
            <legend>I am signing up as a</legend>
            <div class="account-options">
              <label class="account-option">
                <input type="radio" name="accountType" value="job_seeker" checked>
                Job seeker
              </label>
              <label class="account-option">
                <input type="radio" name="accountType" value="recruiter">
                Recruiter
              </label>
            </div>
          </fieldset>
          <div class="form">
            <input name="fullName" type="text" placeholder="Name"   />
          </div>
          <div class="form">
            <input name="email" type="email" placeholder="Email"
                autocomplete="email" required />
          </div>

          <div class="form">
            <input name="password" type="password" placeholder="Password"
                     />
          </div>

         <p id="message" role="status"></p>
          <button type="submit">Create account</button>

            <p class="info">
           Already have an account? <a href="/login">Log in</a>
        </p>
        </form>
      </section>
      </div>

  <div class="design">

     <img src="design.jpg" alt="">
  </div>
</div>


    <script src="register.js"></script>
     </body>
    </html>
